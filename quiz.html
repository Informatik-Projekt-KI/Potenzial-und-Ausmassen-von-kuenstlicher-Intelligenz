<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Quiz – KI-Projekt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }
        .page-wrapper { width: 100%; max-width: 1100px; }
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111111;
            border-radius: 18px;
            padding: 10px 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .logo {
            font-family: "Bauhaus 93", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 26px;
            letter-spacing: 1px;
        }
        .nav-links {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .nav-links a {
            font-family: "Agency FB", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 16px;
            text-decoration: none;
            color: #f5f5f5;
            padding: 8px 14px;
            border-radius: 999px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            transition: all 0.2s ease;
        }
        .nav-links a:hover {
            background: #ffffff;
            color: #000000;
        }
        .nav-links a.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
        .content-card {
            background: #181818;
            border-radius: 24px;
            padding: 24px 26px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.7);
            max-height: calc(100vh - 140px);
            overflow-y: auto;
        }
        h1 {
            font-family: "Bauhaus 93", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 40px;
            margin-bottom: 10px;
        }
        h2, h3, label {
            font-family: "Agency FB", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 1px;
        }
        p {
            line-height: 1.6;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .question {
            margin-top: 16px;
            margin-bottom: 10px;
        }
        .question p {
            margin-bottom: 6px;
        }
        .question input {
            margin-right: 6px;
        }
    </style>
</head>
<body>
<div class="page-wrapper">
    <header class="nav-bar">
        <div class="logo">KI-Projekt</div>
        <nav class="nav-links">
            <a href="index.html">Startseite</a>
            <a href="umfrage.html">Umfrage</a>
            <a href="potenzial-ki.html">Potenzial KI</a>
            <a href="auswirkungen-ki.html">Auswirkungen KI</a>
            <a href="quiz.html" class="active">Quiz</a>
            <a href="chatbot.html">Chatbot</a>
            <a href="quellen.html">Quellen</a>
        </nav>
    </header>

    <main class="content-card">
        <h1>Quiz</h1>
        <h2>Teste dein Wissen über KI</h2>

        <div class="question">
            <p>1. Wofür steht die Abkürzung „KI“?</p>
            <label><input type="radio" name="q1">Kognitive Informatik</label><br>
            <label><input type="radio" name="q1">Künstliche Intelligenz</label><br>
            <label><input type="radio" name="q1">Komplexe Integration</label>
        </div>

        <div class="question">
            <p>2. Wo wird KI heute bereits eingesetzt?</p>
            <label><input type="checkbox" name="q2">Sprachassistenten</label><br>
            <label><input type="checkbox" name="q2">Medizinische Diagnostik</label><br>
            <label><input type="checkbox" name="q2">Autonomes Fahren</label>
        </div>

        <p style="margin-top: 20px; opacity: 0.7;">
            (Hier kannst du später mit JavaScript ein richtiges interaktives Quiz daraus machen.)
        </p>
    </main>
</div>

</html>
