<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Umfrage – KI-Projekt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background:#000;
            color:#fff;
            font-family:Arial;
            padding:20px;
            display:flex;
            justify-content:center;
        }

        .page-wrapper {
            width:100%;
            max-width:1100px;
        }

        .nav-bar {
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#111;
            padding:10px 20px;
            border-radius:18px;
            margin-bottom:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.6);
        }

        .logo {
            font-family:"Bauhaus 93";
            font-size:26px;
        }

        .nav-links {
            display:flex;
            gap:14px;
        }

        .nav-links a {
            font-family:"Agency FB";
            font-size:16px;
            text-decoration:none;
            color:#fff;
            padding:8px 14px;
            border-radius:999px;
            background:#1a1a1a;
            border:1px solid #2a2a2a;
        }

        .nav-links a.active,
        .nav-links a:hover {
            background:#fff;
            color:#000;
        }

        .content-card {
            background:#181818;
            padding:30px;
            border-radius:24px;
            box-shadow:0 18px 40px rgba(0,0,0,0.7);
        }

        h1,h2 {
            text-align:center;
            font-family:"Agency FB";
            letter-spacing:1px;
        }

        h1 {
            font-size:40px;
            margin-bottom:20px;
        }

        h2 {
            font-size:28px;
            margin-top:40px;
            margin-bottom:10px;
        }

        p {
            font-size:17px;
            line-height:1.7;
            margin-bottom:10px;
        }

        .question-box {
            background:#202020;
            padding:20px;
            border-radius:18px;
            margin-bottom:30px;
        }

        canvas {
            margin-top:20px;
        }
    </style>
</head>

<body>
    <div class="page-wrapper">

        <!-- NAVIGATION -->
        <header class="nav-bar">
            <div class="logo">KI-Projekt</div>

            <nav class="nav-links">
                <a href="index.html">Startseite</a>
                <a href="umfrage.html" class="active">Umfrage</a>
                <a href="potenzial-ki.html">Potenzial KI</a>
                <a href="auswirkungen-ki.html">Auswirkungen KI</a>
                <a href="quiz.html">Quiz</a>
                <a href="chatbot.html">Chatbot</a>
                <a href="quellen.html">Quellen</a>
            </nav>
        </header>

        <main class="content-card">

            <h1>Umfrage – Ergebnisse</h1>

            <!-- DIAGRAMM 1 -->
            <div class="question-box">
                <h2>Alter der Teilnehmenden</h2>
                <canvas id="q1"></canvas>
            </div>

            <!-- DIAGRAMM 2 -->
            <div class="question-box">
                <h2>Geschlecht</h2>
                <canvas id="q2"></canvas>
            </div>

            <!-- DIAGRAMM 3 -->
            <div class="question-box">
                <h2>Nutzungshäufigkeit von KI</h2>
                <canvas id="q3"></canvas>
            </div>

            <!-- DIAGRAMM 4 -->
            <div class="question-box">
                <h2>Beziehung zu KI</h2>
                <canvas id="q5"></canvas>
            </div>

            <!-- DIAGRAMM 5 -->
            <div class="question-box">
                <h2>Bewusstsein für ökologische Auswirkungen</h2>
                <canvas id="q6"></canvas>
            </div>

            <!-- DIAGRAMM 6 -->
            <div class="question-box">
                <h2>Bekannte KI‑Anwendungen</h2>
                <canvas id="q7"></canvas>
            </div>

            <!-- DIAGRAMM 7 -->
            <div class="question-box">
                <h2>Überraschung über KI‑Verbreitung</h2>
                <canvas id="q8"></canvas>
            </div>

        </main>
    </div>

    <script>
        /* DIAGRAMM 1 */
        new Chart(document.getElementById("q1"), {
            type: "bar",
            data: {
                labels: ["12–20", "21–30", "31–45", "45–60", "60+"],
                datasets: [{
                    label: "Anzahl",
                    data: [118, 10, 5, 3, 2],
                    backgroundColor: "#3498db"
                }]
            },
            options: { indexAxis: "y", responsive: true }
        });

        /* DIAGRAMM 2 */
        new Chart(document.getElementById("q2"), {
            type: "bar",
            data: {
                labels: ["Weiblich", "Männlich", "Divers"],
                datasets: [{
                    label: "Anzahl",
                    data: [100, 35, 3],
                    backgroundColor: "#9b59b6"
                }]
            },
            options: { indexAxis: "y", responsive: true }
        });

        /* DIAGRAMM 3 */
        new Chart(document.getElementById("q3"), {
            type: "bar",
            data: {
                labels: ["Stündlich", "Mehrmals/Tag", "Mehrmals/Woche", "Einmal/Woche", "Mehrmals/Monat", "Einmal/Monat"],
                datasets: [{
                    label: "Anzahl",
                    data: [2, 38, 60, 19, 10, 9],
                    backgroundColor: "#1abc9c"
                }]
            },
            options: { indexAxis: "y", responsive: true }
        });

        /* DIAGRAMM 4 */
        new Chart(document.getElementById("q5"), {
            type: "bar",
            data: {
                labels: ["Neutral", "Potenzial", "Angst", "Gegen KI"],
                datasets: [{
                    label: "Anzahl",
                    data: [70, 66, 16, 8],
                    backgroundColor: "#e67e22"
                }]
            },
            options: { indexAxis: "y", responsive: true }
        });

        /* DIAGRAMM 5 */
        new Chart(document.getElementById("q6"), {
            type: "bar",
            data: {
                labels: ["Ja", "Zum Teil", "Nein"],
                datasets: [{
                    label: "Anzahl",
                    data: [43, 64, 14],
                    backgroundColor: "#2ecc71"
                }]
            },
            options: { indexAxis: "y", responsive: true }
        });

        /* DIAGRAMM 6 */
        new Chart(document.getElementById("q7"), {
            type: "bar",
            data: {
                labels: [
                    "Smart Home", "Sprachassistenten", "Fitness-Tracker", "E-Mail Filter",
                    "Suchmaschinen", "Chatbots", "Navigation", "Streaming",
                    "Online-Shopping", "Flug-Buchungen", "Autonome Fahrzeuge",
                    "Kreditkartenbetrug", "Face ID", "Produktentwicklung",
                    "Jobfilter", "Medizin", "ChatGPT", "Lern-KI",
                    "Kamera-Optimierung", "Bild/Video KI", "Fake News"
                ],
                datasets: [{
                    label: "Anzahl",
                    data: [100, 120, 80, 90, 110, 121, 95, 36, 70, 40, 30, 50, 85, 45, 25, 60, 121, 70, 90, 100, 55],
                    backgroundColor: "#f1c40f"
                }]
            },
            options: { responsive: true }
        });

        /* DIAGRAMM 7 */
        new Chart(document.getElementById("q8"), {
            type: "bar",
            data: {
                labels: ["Ja, kenne mehr", "Nein, überrascht", "Nein, erwartet"],
                datasets: [{
                    label: "Anzahl",
                    data: [20, 90, 28],
                    backgroundColor: "#e74c3c"
                }]
            },
            options: { indexAxis: "y", responsive: true }
        });
    </script>

</body>
</html>
